plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.dhiraj_j_s.minimalsf.extended'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.dhiraj_j_s.minimalsf.extended"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    // F-Droid: don't embed the Google-encrypted dependency metadata block in the APK
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }
}

dependencies {
    // Shizuku: runs the plugin's commands with shell (or root) rights, after the user allows it
    def shizuku = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku"
    implementation "dev.rikka.shizuku:provider:$shizuku"
}
